<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>fractal night</title>
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; background: #07070b; color: #e8e6f0; font: 14px/1.4 ui-sans-serif, system-ui, sans-serif; }
    canvas { display: block; width: 100%; height: 100%; cursor: crosshair; }
    #hud {
      position: fixed; inset: 16px auto auto 16px;
      background: rgba(10,10,16,.72); backdrop-filter: blur(10px);
      border: 1px solid #2a2a3a; border-radius: 14px; padding: 14px 16px; width: min(340px, calc(100vw - 32px));
    }
    h1 { margin: 0 0 8px; font-size: 16px; letter-spacing: .04em; }
    .row { display: flex; gap: 6px; flex-wrap: wrap; margin: 8px 0; }
    button, select {
      background: #161622; color: inherit; border: 1px solid #34344a;
      border-radius: 8px; padding: 6px 10px; cursor: pointer;
    }
    button.active { border-color: #8b7cff; background: #221f3a; }
    .meta { opacity: .65; font-size: 12px; }
  </style>
</head>
<body>
  <canvas id="c"></canvas>
  <div id="hud">
    <h1>fractal night</h1>
    <div class="row">
      <button data-mode="mandel" class="active">Mandelbrot</button>
      <button data-mode="julia">Julia</button>
      <button data-mode="multi">Multibrot</button>
      <button data-mode="fern">Fern</button>
    </div>
    <div class="row">
      <button id="palette">palette</button>
      <button id="reset">reset</button>
      <button id="save">save png</button>
    </div>
    <div class="meta" id="info">click to zoom · drag to pan</div>
  </div>
<script>
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d', { willReadFrequently: true });
const info = document.getElementById('info');

let W, H, img, data;
let mode = 'mandel';
let maxIter = 180;
let pal = 0;
let view = { x: -0.75, y: 0, w: 3.2 };
let juliaC = { x: -0.8, y: 0.156 };
let dragging = false, last = null, moved = false;

const palettes = [
  (t) => [20 + 235*t, 30 + 80*t, 255*(1-t*0.3)],
  (t) => [255*t, 40 + 120*Math.sin(t*6), 255*(1-t)],
  (t) => [255*(1-t), 180*t, 40 + 200*t],
  (t) => [30 + 220*t*t, 20 + 200*t, 80 + 160*(1-t)],
];

function resize() {
  W = canvas.width = innerWidth * devicePixelRatio;
  H = canvas.height = innerHeight * devicePixelRatio;
  img = ctx.createImageData(W, H);
  data = img.data;
  draw();
}

function mapX(px) { return view.x + (px / W - 0.5) * view.w; }
function mapY(py) { return view.y + (py / H - 0.5) * view.w * (H / W); }

function escapeColor(iter, zx, zy) {
  if (iter >= maxIter) return [6, 6, 10];
  const mag2 = zx*zx + zy*zy;
  const logzn = Math.log(Math.max(mag2, 1e-12)) / 2;
  const nu = Math.log(logzn / Math.log(2)) / Math.log(2);
  const t = (iter + 1 - nu) / maxIter;
  return palettes[pal % palettes.length](Math.min(1, Math.max(0, t)));
}

function cpow4(zx, zy) {
  const x2 = zx*zx, y2 = zy*zy;
  const r2 = x2 - y2, i2 = 2*zx*zy;
  return { x: r2*r2 - i2*i2, y: 2*r2*i2 };
}

function renderEscape() {
  for (let py = 0; py < H; py++) {
    for (let px = 0; px < W; px++) {
      const cx = mapX(px), cy = mapY(py);
      let zx, zy, cr, ci;
      if (mode === 'julia') { zx = cx; zy = cy; cr = juliaC.x; ci = juliaC.y; }
      else { zx = 0; zy = 0; cr = cx; ci = cy; }
      let i = 0;
      while (zx*zx + zy*zy <= 4 && i < maxIter) {
        if (mode === 'multi') {
          const p = cpow4(zx, zy);
          zx = p.x + cr;
          zy = p.y + ci;
        } else {
          const xt = zx*zx - zy*zy + cr;
          zy = 2*zx*zy + ci;
          zx = xt;
        }
        i++;
      }
      const [r,g,b] = escapeColor(i, zx, zy);
      const o = (py*W + px) * 4;
      data[o] = r; data[o+1] = g; data[o+2] = b; data[o+3] = 255;
    }
  }
  ctx.putImageData(img, 0, 0);
}

function renderFern() {
  ctx.fillStyle = '#07070b';
  ctx.fillRect(0, 0, W, H);
  let x = 0, y = 0;
  const n = Math.min(250000, W * H * 0.35);
  const img2 = ctx.getImageData(0, 0, W, H);
  const d = img2.data;
  for (let k = 0; k < n; k++) {
    const r = Math.random();
    let nx, ny;
    if (r < 0.01) { nx = 0; ny = 0.16*y; }
    else if (r < 0.86) { nx = 0.85*x + 0.04*y; ny = -0.04*x + 0.85*y + 1.6; }
    else if (r < 0.93) { nx = 0.20*x - 0.26*y; ny = 0.23*x + 0.22*y + 1.6; }
    else { nx = -0.15*x + 0.28*y; ny = 0.26*x + 0.24*y + 0.44; }
    x = nx; y = ny;
    const px = ((x + 2.5) / 5) * W;
    const py = H - (y / 10.5) * H;
    const ix = px|0, iy = py|0;
    if (ix>=0 && iy>=0 && ix<W && iy<H) {
      const o = (iy*W + ix)*4;
      d[o] = Math.min(255, d[o] + 8);
      d[o+1] = Math.min(255, d[o+1] + 28);
      d[o+2] = Math.min(255, d[o+2] + 6);
      d[o+3] = 255;
    }
  }
  ctx.putImageData(img2, 0, 0);
}

function draw() {
  const t0 = performance.now();
  if (mode === 'fern') renderFern();
  else renderEscape();
  info.textContent = `${mode} · ${W}×${H} · ${(performance.now()-t0).toFixed(0)}ms · click zoom · drag pan`;
}

document.querySelectorAll('[data-mode]').forEach(btn => {
  btn.onclick = () => {
    document.querySelectorAll('[data-mode]').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    mode = btn.dataset.mode;
    resetView();
  };
});

function resetView() {
  maxIter = 180;
  view = mode === 'multi' ? { x: 0, y: 0, w: 3.0 } : { x: -0.75, y: 0, w: 3.2 };
  draw();
}

document.getElementById('palette').onclick = () => { pal++; draw(); };
document.getElementById('reset').onclick = resetView;
document.getElementById('save').onclick = () => {
  const a = document.createElement('a');
  a.download = `fractal-night-${mode}.png`;
  a.href = canvas.toDataURL('image/png');
  a.click();
};

canvas.addEventListener('mousedown', e => { dragging = true; moved = false; last = e; });
addEventListener('mouseup', () => dragging = false);
canvas.addEventListener('mousemove', e => {
  if (mode === 'julia' && !dragging) {
    juliaC.x = mapX(e.clientX * devicePixelRatio);
    juliaC.y = mapY(e.clientY * devicePixelRatio);
    draw();
    return;
  }
  if (!dragging) return;
  moved = true;
  const dx = (e.clientX - last.clientX) * devicePixelRatio;
  const dy = (e.clientY - last.clientY) * devicePixelRatio;
  view.x -= dx / W * view.w;
  view.y -= dy / H * view.w * (H / W);
  last = e;
  draw();
});
canvas.addEventListener('click', e => {
  if (mode === 'fern' || moved) return;
  view.x = mapX(e.clientX * devicePixelRatio);
  view.y = mapY(e.clientY * devicePixelRatio);
  view.w *= 0.45;
  maxIter = Math.min(600, maxIter + 20);
  draw();
});
canvas.addEventListener('wheel', e => {
  e.preventDefault();
  const f = e.deltaY > 0 ? 1.15 : 0.85;
  const mx = mapX(e.clientX * devicePixelRatio);
  const my = mapY(e.clientY * devicePixelRatio);
  view.x = mx + (view.x - mx) * f;
  view.y = my + (view.y - my) * f;
  view.w *= f;
  draw();
}, { passive: false });

addEventListener('resize', resize);
resize();
</script>
</body>
</html>
